[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xena-client"
version = "0.1.0"
description = "Unified client for Xena API - provides easy access to all Xena domains"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jarle", email = "your-email@example.com"}
]
keywords = ["xena", "api", "client", "accounting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.25.0",
    "xena-accountant>=0.1.0",
    "xena-appstore>=0.1.0",
    "xena-archive>=0.1.0",
    "xena-article>=0.1.0",
    "xena-bank>=0.1.0",
    "xena-chart>=0.1.0",
    "xena-core>=0.1.0",
    "xena-developer>=0.1.0",
    "xena-document>=0.1.0",
    "xena-finance>=0.1.0",
    "xena-order>=0.1.0",
    "xena-partner>=0.1.0",
    "xena-price>=0.1.0",
    "xena-project>=0.1.0",
    "xena-provider>=0.1.0",
    "xena-reporting>=0.1.0",
    "xena-scheduling>=0.1.0",
    "xena-subscription>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/xena-packages"
Repository = "https://github.com/yourusername/xena-packages"

[tool.setuptools.packages.find]
where = ["."]
include = ["xena_client*"]
